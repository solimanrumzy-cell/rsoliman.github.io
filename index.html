<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R. Soliman | Virginia Realtor</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #f7f9fc, #e3e9f0);
      color: #1a1a1a;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 90%;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }
    h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 0.5px;
    }
    h2 {
      color: #555;
      font-size: 1.05rem;
      font-weight: normal;
      margin-top: 0.4rem;
    }
    .tagline {
      margin-top: 1.5rem;
      color: #444;
      font-size: 1rem;
      line-height: 1.6;
    }
    .contact {
      margin-top: 2rem;
      font-size: 1rem;
      color: #333;
    }
    .contact strong {
      display: block;
      margin-top: 0.3rem;
      font-size: 1.05rem;
    }
    a {
      color: #0078ff;
      font-weight: 500;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>R. Soliman</h1>
    <h2>Licensed Realtor | Samson Properties</h2>

    <div class="tagline">
      Helping clients across Northern Virginia with<br>
      Residential Buying, Selling & Renting<br>
      as well as Commercial Properties and Investments.
    </div>

    <div class="contact">
      📍 Northern Virginia<br>
      📞 <strong>571&nbsp;999&nbsp;4356</strong>
      📧 <strong><a href="mailto:soliman@solimanre.com">soliman@solimanre.com</a></strong>
    </div>
  </div>
</body>
</html>
